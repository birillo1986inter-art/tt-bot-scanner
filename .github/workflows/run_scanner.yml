name: run-scanner

on:
  schedule:
    # 08:30 ora italiana (07:30 UTC - ora solare)
    - cron: '30 7 * * *'
    # 16:03 ora italiana (15:03 UTC - ora solare)
    - cron: '3 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py

      - name: Commit and push palinsesto.json
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add palinsesto.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico palinsesto.json [skip ci]" && git push)
