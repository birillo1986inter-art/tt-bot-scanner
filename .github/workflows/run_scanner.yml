name: TT Cup Daily Digest

on:
  schedule:
    # Per oggi lo facciamo partire ogni ora o fai "Run workflow" a mano. 
    # Dal 20 ottobre partirà tutti i giorni alle 08:00 UTC (corrispondenti alle 8:00/9:00 italiane)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-daily-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run daily scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
